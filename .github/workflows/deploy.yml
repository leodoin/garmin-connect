name: Deploy to GCP
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: garmin-production-deployment
  cancel-in-progress: false
jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.5
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev pytest -q
  deploy:
    needs: test
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: garmin-connect-leodoin
      GCP_ZONE: us-central1-a
      GCP_VM: garmin-history
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google using short-lived identity
        uses: google-github-actions/auth@v3
        with:
          project_id: garmin-connect-leodoin
          workload_identity_provider: projects/4078144675/locations/global/workloadIdentityPools/github-garmin/providers/github
          service_account: github-garmin-deploy@garmin-connect-leodoin.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify immutable source archive
        run: |
          curl --fail --location --retry 3 "https://github.com/leodoin/garmin-connect/archive/${GITHUB_SHA}.tar.gz" -o "$RUNNER_TEMP/garmin-source.tar.gz"
          echo "SOURCE_SHA256=$(sha256sum "$RUNNER_TEMP/garmin-source.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Deploy and verify, rolling back on failure
        run: |
          gcloud compute ssh "garminadmin@${GCP_VM}" \
            --project="$GCP_PROJECT" --zone="$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after=30m --quiet \
            --command="set -e; curl --fail --location --retry 3 https://github.com/leodoin/garmin-connect/archive/${GITHUB_SHA}.tar.gz -o /tmp/garmin-${GITHUB_SHA}.tar.gz; echo '${SOURCE_SHA256}  /tmp/garmin-${GITHUB_SHA}.tar.gz' | sha256sum -c -; mkdir -p /tmp/garmin-deploy-${GITHUB_SHA}; tar -xzf /tmp/garmin-${GITHUB_SHA}.tar.gz --strip-components=1 -C /tmp/garmin-deploy-${GITHUB_SHA}; sudo bash /tmp/garmin-deploy-${GITHUB_SHA}/deploy/gcp/deploy-release.sh /tmp/garmin-${GITHUB_SHA}.tar.gz ${GITHUB_SHA}"
      - name: Deployment summary
        run: |
          echo "Deployed commit $GITHUB_SHA to $GCP_VM via IAP." >> "$GITHUB_STEP_SUMMARY"
          echo 'Credentials and Garmin session remain on the VM. Refresh tools in ChatGPT after schema changes.' >> "$GITHUB_STEP_SUMMARY"
