config_version: 1
control_plane:
  base_url: https://api.openai.com
  tunnel_id: tunnel_REPLACE_WITH_YOUR_TUNNEL_ID
  api_key: file:/run/credentials/garmin-mcp.service/runtime-key
health:
  listen_addr: 127.0.0.1:8080
admin_ui:
  open_browser: false
log:
  level: warn
  format: json
mcp:
  commands:
    - channel: main
      command: /opt/garmin-mcp/.venv/bin/python -m garmin_mcp.local
